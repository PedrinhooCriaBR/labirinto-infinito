<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Labirinto Infinito</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {

            background: linear-gradient(
                135deg,
                #111827,
                #1e3a5f
            );

            color: white;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding: 15px;

            overflow-x: hidden;
        }


        /* =========================
           TÍTULO
        ========================= */

        h1 {

            margin: 10px 0 15px;

            text-align: center;

            font-size:
                clamp(24px, 5vw, 38px);
        }


        /* =========================
           PAINEL
        ========================= */

        .painel {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            justify-content: center;

            width: 100%;

            max-width: 900px;

            margin-bottom: 15px;
        }


        .info {

            background: #1f2937;

            padding: 10px 15px;

            border-radius: 10px;

            border: 2px solid #374151;

            font-weight: bold;

            font-size:
                clamp(14px, 3vw, 18px);
        }


        /* =========================
           BOTÕES
        ========================= */

        button {

            border: none;

            border-radius: 10px;

            cursor: pointer;

            color: white;

            font-weight: bold;

            font-size: 16px;

            transition: 0.15s;

            touch-action: manipulation;
        }


        button:active {

            transform: scale(0.92);
        }


        #comecar {

            background: #22c55e;

            padding: 10px 18px;
        }


        #resetar {

            background: #ef4444;

            padding: 10px 18px;
        }


        /* =========================
           ÁREA DO LABIRINTO
        ========================= */

        #areaLabirinto {

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }


        #labirinto {

            display: grid;

            background: white;

            border: 4px solid white;

            max-width: 94vw;

            max-height: 60vh;

            max-height: 60dvh;
        }


        .celula {

            position: relative;

            width: 35px;

            height: 35px;
        }


        .parede {

            background: #111827;
        }


        .caminho {

            background: #e5e7eb;
        }


        /* =========================
           JOGADOR
        ========================= */

        .jogador {

            background: #2563eb !important;

            border-radius: 50%;

            border: 2px solid white;

            position: relative;

            z-index: 10;

            box-shadow:
                0 0 4px rgba(0,0,0,0.8),
                inset 0 0 3px
                rgba(255,255,255,0.7);
        }


        .jogador::after {

            content: "";

            position: absolute;

            width: 35%;

            height: 35%;

            min-width: 3px;

            min-height: 3px;

            background: white;

            border-radius: 50%;

            top: 15%;

            left: 18%;
        }


        /* =========================
           FINAL
        ========================= */

        .final {

            background: #facc15;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            z-index: 5;
        }


        /* =========================
           MENSAGEM
        ========================= */

        #mensagem {

            display: none;
        }


        /* =========================
           CONTROLES MOBILE
        ========================= */

        #controlesMobile {

            display: none;

            margin-top: 15px;

            width: 210px;

            height: 145px;

            position: relative;
        }


        .botaoMovimento {

            position: absolute;

            width: 60px;

            height: 60px;

            background: #2563eb;

            border: 3px solid #60a5fa;

            border-radius: 15px;

            font-size: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            user-select: none;
        }


        .botaoMovimento:active {

            background: #1d4ed8;

            transform: scale(0.9);
        }


        #cima {

            top: 0;

            left: 75px;
        }


        #esquerda {

            top: 75px;

            left: 0;
        }


        #baixo {

            top: 75px;

            left: 75px;
        }


        #direita {

            top: 75px;

            right: 0;
        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 700px) {

            body {

                padding: 10px;

                justify-content: flex-start;
            }


            h1 {

                margin-top: 5px;

                margin-bottom: 10px;
            }


            .painel {

                gap: 6px;

                margin-bottom: 10px;
            }


            .info {

                padding: 8px 10px;

                font-size: 14px;
            }


            #comecar,
            #resetar {

                padding: 8px 12px;

                font-size: 14px;
            }


            #labirinto {

                max-width: 94vw;

                max-height: 50vh;

                max-height: 50dvh;
            }


            #controlesMobile {

                display: block;
            }


            .jogador {

                border: 1px solid white;

                box-shadow:
                    0 0 3px black,
                    0 0 2px white;
            }

        }


        /* =========================
           CELULAR DEITADO
        ========================= */

        @media (max-width: 900px)
        and (orientation: landscape) {

            body {

                padding: 5px;
            }


            h1 {

                font-size: 22px;

                margin: 2px;
            }


            .painel {

                margin-bottom: 5px;
            }


            #labirinto {

                max-height: 48vh;

                max-height: 48dvh;
            }


            #controlesMobile {

                width: 145px;

                height: 103px;

                margin-top: 5px;
            }


            .botaoMovimento {

                width: 42px;

                height: 42px;

                font-size: 20px;
            }


            #cima {

                left: 51px;

                top: 0;
            }


            #esquerda {

                left: 0;

                top: 51px;
            }


            #baixo {

                left: 51px;

                top: 51px;
            }


            #direita {

                right: 0;

                top: 51px;
            }

        }

    </style>

</head>


<body>


    <h1>

        🌀 Labirinto Infinito

    </h1>


    <div class="painel">


        <div class="info">

            🏆 Fase:

            <span id="fase">

                1

            </span>

        </div>


        <div class="info">

            ⏱ Tempo:

            <span id="tempo">

                0

            </span>s

        </div>


        <div class="info">

            🥇 Recorde:

            <span id="recorde">

                --

            </span>

        </div>


        <button id="comecar">

            ▶ Começar

        </button>


        <button id="resetar">

            ↻ Resetar

        </button>


    </div>


    <div id="areaLabirinto">

        <div id="labirinto"></div>

    </div>


    <!-- =========================
         CONTROLES MOBILE
    ========================== -->

    <div id="controlesMobile">


        <button
            class="botaoMovimento"
            id="cima">

            ▲

        </button>


        <button
            class="botaoMovimento"
            id="esquerda">

            ◀

        </button>


        <button
            class="botaoMovimento"
            id="baixo">

            ▼

        </button>


        <button
            class="botaoMovimento"
            id="direita">

            ▶

        </button>


    </div>


    <div id="mensagem"></div>


    <script>


        /* =====================================================
           VARIÁVEIS
        ===================================================== */

        const labirinto =
            document.getElementById(
                "labirinto"
            );


        let fase = 1;

        let tamanho = 9;

        let mapa = [];


        let jogador = {

            linha: 1,

            coluna: 1

        };


        let final = {

            linha: 0,

            coluna: 0

        };


        let jogoAtivo = false;


        let tempo = 0;


        let cronometro = null;


        let cronometroIniciado =
            false;


        let recorde =
            localStorage.getItem(
                "recordeLabirinto"
            );


        if (recorde) {

            document.getElementById(
                "recorde"
            ).textContent =
                recorde + "s";

        }


        /* =====================================================
           GERAR LABIRINTO
        ===================================================== */

        function gerarLabirinto() {


            /*
                FASES 1 ATÉ 7

                9
                11
                13
                15
                17
                19
                21
            */

            if (fase < 8) {

                gerarLabirintoNormal();

                return;
            }


            /*
                FASE 8 EM DIANTE

                25
                27
                29
                31
            */

            tamanho =
                Math.min(
                    31,
                    25 +
                    (fase - 8) * 2
                );


            gerarLabirintoGrande();

        }


        /* =====================================================
           LABIRINTO NORMAL
        ===================================================== */

        function gerarLabirintoNormal() {


            mapa = [];


            /*
                TUDO COMEÇA COMO PAREDE
            */

            for (
                let linha = 0;
                linha < tamanho;
                linha++
            ) {

                mapa[linha] = [];


                for (
                    let coluna = 0;
                    coluna < tamanho;
                    coluna++
                ) {

                    mapa[linha][coluna] = 1;

                }

            }


            /*
                CRIA OS CORREDORES
            */

            function criarCaminho(
                linha,
                coluna
            ) {


                mapa[linha][coluna] = 0;


                const direcoes = [

                    [-2, 0],

                    [2, 0],

                    [0, -2],

                    [0, 2]

                ];


                direcoes.sort(
                    () =>
                        Math.random() - 0.5
                );


                for (
                    let direcao of direcoes
                ) {


                    const novaLinha =
                        linha +
                        direcao[0];


                    const novaColuna =
                        coluna +
                        direcao[1];


                    if (

                        novaLinha > 0 &&

                        novaLinha <
                        tamanho - 1 &&

                        novaColuna > 0 &&

                        novaColuna <
                        tamanho - 1 &&

                        mapa[
                            novaLinha
                        ][
                            novaColuna
                        ] === 1

                    ) {


                        mapa[
                            linha +
                            direcao[0] / 2
                        ][
                            coluna +
                            direcao[1] / 2
                        ] = 0;


                        criarCaminho(
                            novaLinha,
                            novaColuna
                        );

                    }

                }

            }


            criarCaminho(1, 1);


            /*
                POUCOS CAMINHOS EXTRAS
            */

            adicionarCaminhosExtras(
                0.12
            );


            /*
                INÍCIO
            */

            jogador.linha = 1;

            jogador.coluna = 1;

            mapa[1][1] = 0;


            /*
                FINAL
            */

            final.linha =
                tamanho - 2;

            final.coluna =
                tamanho - 2;


            mapa[
                final.linha
            ][
                final.coluna
            ] = 0;


            desenharLabirinto();

        }


        /* =====================================================
           LABIRINTO GRANDE
           
           A PARTIR DA FASE 8
        ===================================================== */

        function gerarLabirintoGrande() {


            mapa = [];


            /*
                =============================================
                TUDO COMEÇA COMO PAREDE
                =============================================
            */

            for (
                let linha = 0;
                linha < tamanho;
                linha++
            ) {

                mapa[linha] = [];


                for (
                    let coluna = 0;
                    coluna < tamanho;
                    coluna++
                ) {

                    mapa[linha][coluna] = 1;

                }

            }


            /*
                =============================================
                ENTRADA
                =============================================
            */

            const colunaEntrada =
                Math.floor(
                    tamanho / 2
                );


            /*
                Garante posição ímpar.
            */

            const entrada =
                colunaEntrada % 2 === 0
                    ? colunaEntrada - 1
                    : colunaEntrada;


            /*
                =============================================
                GERADOR DO LABIRINTO
                =============================================
            */

            function criarCaminhoGrande(
                linha,
                coluna
            ) {


                mapa[linha][coluna] = 0;


                const direcoes = [

                    [-2, 0],

                    [2, 0],

                    [0, -2],

                    [0, 2]

                ];


                /*
                    Mistura as direções
                    para cada labirinto
                    ficar diferente.
                */

                direcoes.sort(
                    () =>
                        Math.random() - 0.5
                );


                for (
                    let direcao of direcoes
                ) {


                    const novaLinha =
                        linha +
                        direcao[0];


                    const novaColuna =
                        coluna +
                        direcao[1];


                    if (

                        novaLinha > 0 &&

                        novaLinha <
                        tamanho - 1 &&

                        novaColuna > 0 &&

                        novaColuna <
                        tamanho - 1 &&

                        mapa[
                            novaLinha
                        ][
                            novaColuna
                        ] === 1

                    ) {


                        /*
                            Abre apenas
                            uma célula
                            entre os corredores.
                        */

                        mapa[
                            linha +
                            direcao[0] / 2
                        ][
                            coluna +
                            direcao[1] / 2
                        ] = 0;


                        criarCaminhoGrande(
                            novaLinha,
                            novaColuna
                        );

                    }

                }

            }


            /*
                COMEÇA NO TOPO
            */

            criarCaminhoGrande(
                1,
                entrada
            );


            /*
                =============================================
                ENTRADA PELO TOPO
                =============================================
            */

            jogador.linha = 0;

            jogador.coluna = entrada;


            mapa[0][entrada] = 0;

            mapa[1][entrada] = 0;


            /*
                =============================================
                SAÍDA PELO FUNDO
                =============================================
            */

            final.linha =
                tamanho - 1;

            final.coluna =
                entrada;


            mapa[
                tamanho - 2
            ][
                entrada
            ] = 0;


            mapa[
                tamanho - 1
            ][
                entrada
            ] = 0;


            /*
                =============================================
                POUQUÍSSIMAS CONEXÕES EXTRAS
                =============================================

                O valor baixo é proposital.

                Queremos MUITAS paredes.
            */

            adicionarCaminhosExtras(
                0.06
            );


            /*
                =============================================
                GARANTE ENTRADA
                =============================================
            */

            mapa[0][entrada] = 0;

            mapa[1][entrada] = 0;


            /*
                =============================================
                GARANTE SAÍDA
                ============================================= */

            mapa[
                tamanho - 2
            ][
                entrada
            ] = 0;


            mapa[
                tamanho - 1
            ][
                entrada
            ] = 0;


            desenharLabirinto();

        }


        /* =====================================================
           CAMINHOS EXTRAS
           
           MUITO REDUZIDOS
        ===================================================== */

        function adicionarCaminhosExtras(
            chance
        ) {


            /*
                =============================================
                PRIMEIRA PASSADA
                =============================================

                Só abre uma pequena quantidade
                de paredes que ligam dois corredores.
            */

            for (
                let linha = 1;
                linha < tamanho - 1;
                linha++
            ) {


                for (
                    let coluna = 1;
                    coluna < tamanho - 1;
                    coluna++
                ) {


                    /*
                        Se já é caminho,
                        não mexe.
                    */

                    if (
                        mapa[
                            linha
                        ][
                            coluna
                        ] !== 1
                    ) {

                        continue;

                    }


                    /*
                        ESQUERDA + DIREITA
                    */

                    const horizontal =

                        mapa[
                            linha
                        ][
                            coluna - 1
                        ] === 0 &&

                        mapa[
                            linha
                        ][
                            coluna + 1
                        ] === 0;


                    /*
                        CIMA + BAIXO
                    */

                    const vertical =

                        mapa[
                            linha - 1
                        ][
                            coluna
                        ] === 0 &&

                        mapa[
                            linha + 1
                        ][
                            coluna
                        ] === 0;


                    /*
                        Abre muito pouco.
                    */

                    if (
                        horizontal ||
                        vertical
                    ) {


                        if (
                            Math.random()
                            <
                            chance * 0.35
                        ) {

                            mapa[
                                linha
                            ][
                                coluna
                            ] = 0;

                        }

                    }

                }

            }


            /*
                =============================================
                SEGUNDA PASSADA
                =============================================

                Cria algumas bifurcações,
                mas sem deixar o mapa aberto.
            */

            const tentativas =
                Math.floor(
                    tamanho * 0.5
                );


            for (
                let i = 0;
                i < tentativas;
                i++
            ) {


                const linha =
                    1 +
                    Math.floor(
                        Math.random()
                        *
                        (tamanho - 2)
                    );


                const coluna =
                    1 +
                    Math.floor(
                        Math.random()
                        *
                        (tamanho - 2)
                    );


                /*
                    Só trabalha
                    com parede.
                */

                if (
                    mapa[
                        linha
                    ][
                        coluna
                    ] !== 1
                ) {

                    continue;

                }


                let vizinhos = 0;


                /*
                    CIMA
                */

                if (
                    mapa[
                        linha - 1
                    ][
                        coluna
                    ] === 0
                ) {

                    vizinhos++;

                }


                /*
                    BAIXO
                */

                if (
                    mapa[
                        linha + 1
                    ][
                        coluna
                    ] === 0
                ) {

                    vizinhos++;

                }


                /*
                    ESQUERDA
                */

                if (
                    mapa[
                        linha
                    ][
                        coluna - 1
                    ] === 0
                ) {

                    vizinhos++;

                }


                /*
                    DIREITA
                */

                if (
                    mapa[
                        linha
                    ][
                        coluna + 1
                    ] === 0
                ) {

                    vizinhos++;

                }


                /*
                    Só abre quando
                    exatamente dois
                    corredores se encontram.
                */

                if (
                    vizinhos === 2 &&
                    Math.random() < 0.25
                ) {

                    mapa[
                        linha
                    ][
                        coluna
                    ] = 0;

                }

            }

        }


        /* =====================================================
           TAMANHO DA CÉLULA
        ===================================================== */

        function calcularTamanhoCelula() {


            const largura =
                window.innerWidth;


            const altura =
                window.innerHeight;


            let tamanhoMaximo =
                Math.min(

                    largura * 0.90,

                    altura * 0.50

                );


            let tamanhoCelula =
                Math.floor(

                    tamanhoMaximo
                    /
                    tamanho

                );


            if (
                tamanhoCelula > 35
            ) {

                tamanhoCelula = 35;

            }


            /*
                Evita o jogador
                desaparecer em
                fases muito grandes.
            */

            if (
                tamanhoCelula < 9
            ) {

                tamanhoCelula = 9;

            }


            return tamanhoCelula;

        }


        /* =====================================================
           DESENHAR
        ===================================================== */

        function desenharLabirinto() {


            labirinto.innerHTML = "";


            const tamanhoCelula =
                calcularTamanhoCelula();


            labirinto.style.gridTemplateColumns =
                `repeat(
                    ${tamanho},
                    ${tamanhoCelula}px
                )`;


            for (
                let linha = 0;
                linha < tamanho;
                linha++
            ) {


                for (
                    let coluna = 0;
                    coluna < tamanho;
                    coluna++
                ) {


                    const celula =
                        document.createElement(
                            "div"
                        );


                    celula.classList.add(
                        "celula"
                    );


                    celula.style.width =
                        tamanhoCelula + "px";


                    celula.style.height =
                        tamanhoCelula + "px";


                    /*
                        PAREDE
                    */

                    if (

                        mapa[
                            linha
                        ][
                            coluna
                        ] === 1

                    ) {

                        celula.classList.add(
                            "parede"
                        );

                    }


                    /*
                        CAMINHO
                    */

                    else {

                        celula.classList.add(
                            "caminho"
                        );

                    }


                    /*
                        JOGADOR
                    */

                    if (

                        linha ===
                        jogador.linha &&

                        coluna ===
                        jogador.coluna

                    ) {

                        celula.classList.add(
                            "jogador"
                        );

                    }


                    /*
                        FINAL
                    */

                    if (

                        linha ===
                        final.linha &&

                        coluna ===
                        final.coluna

                    ) {


                        celula.classList.add(
                            "final"
                        );


                        celula.innerHTML =
                            "🏁";


                        const tamanhoBandeira =
                            Math.max(

                                7,

                                Math.floor(
                                    tamanhoCelula
                                    * 0.65
                                )

                            );


                        celula.style.fontSize =
                            tamanhoBandeira
                            + "px";

                    }


                    labirinto.appendChild(
                        celula
                    );

                }

            }

        }


        /* =====================================================
           COMEÇAR
        ===================================================== */

        function comecarJogo() {


            if (jogoAtivo)
                return;


            jogoAtivo = true;

        }


        /* =====================================================
           CRONÔMETRO
        ===================================================== */

        function iniciarCronometro() {


            if (
                cronometroIniciado
            )
                return;


            cronometroIniciado =
                true;


            cronometro =
                setInterval(
                    () => {


                        tempo++;


                        document.getElementById(
                            "tempo"
                        ).textContent =
                            tempo;


                    },
                    1000
                );

        }


        /* =====================================================
           MOVIMENTO
        ===================================================== */

        function mover(
            dLinha,
            dColuna
        ) {


            if (!jogoAtivo)
                return;


            const novaLinha =
                jogador.linha
                +
                dLinha;


            const novaColuna =
                jogador.coluna
                +
                dColuna;


            /*
                FORA DO MAPA
            */

            if (

                novaLinha < 0 ||

                novaLinha >= tamanho ||

                novaColuna < 0 ||

                novaColuna >= tamanho

            ) {

                return;

            }


            /*
                PAREDE
            */

            if (

                mapa[
                    novaLinha
                ][
                    novaColuna
                ] === 1

            ) {

                return;

            }


            /*
                PRIMEIRO MOVIMENTO
            */

            iniciarCronometro();


            jogador.linha =
                novaLinha;


            jogador.coluna =
                novaColuna;


            desenharLabirinto();


            verificarVitoria();

        }


        /* =====================================================
           VERIFICAR VITÓRIA
        ===================================================== */

        function verificarVitoria() {


            if (

                jogador.linha ===
                final.linha &&

                jogador.coluna ===
                final.coluna

            ) {


                clearInterval(
                    cronometro
                );


                cronometro = null;


                cronometroIniciado =
                    false;


                jogoAtivo =
                    false;


                /*
                    RECORDE
                */

                if (

                    !recorde ||

                    tempo <
                    Number(recorde)

                ) {


                    recorde =
                        tempo;


                    localStorage.setItem(
                        "recordeLabirinto",
                        recorde
                    );


                    document.getElementById(
                        "recorde"
                    ).textContent =
                        recorde + "s";

                }


                /*
                    PRÓXIMA FASE
                */

                setTimeout(
                    proximaFase,
                    1000
                );

            }

        }


        /* =====================================================
           PRÓXIMA FASE
        ===================================================== */

        function proximaFase() {


            fase++;


            /*
                FASES 1-7
            */

            if (
                fase < 8
            ) {

                tamanho += 2;

            }


            document.getElementById(
                "fase"
            ).textContent =
                fase;


            /*
                Gera novo labirinto.
            */

            gerarLabirinto();


            /*
                Libera o jogo.
            */

            jogoAtivo = true;


            /*
                Cronômetro espera
                o primeiro movimento.
            */

            cronometroIniciado =
                false;

        }


        /* =====================================================
           RESETAR
        ===================================================== */

        function resetarJogo() {


            clearInterval(
                cronometro
            );


            cronometro = null;


            jogoAtivo = false;


            cronometroIniciado =
                false;


            fase = 1;


            tamanho = 9;


            tempo = 0;


            document.getElementById(
                "fase"
            ).textContent =
                "1";


            document.getElementById(
                "tempo"
            ).textContent =
                "0";


            /*
                NÃO APAGA O RECORDE.
            */

            gerarLabirinto();

        }


        /* =====================================================
           TECLADO PC
        ===================================================== */

        document.addEventListener(
            "keydown",
            function(event) {


                const tecla =
                    event.key.toLowerCase();


                /*
                    CIMA
                */

                if (

                    tecla === "arrowup" ||

                    tecla === "w"

                ) {


                    event.preventDefault();


                    mover(
                        -1,
                        0
                    );

                }


                /*
                    BAIXO
                */

                if (

                    tecla === "arrowdown" ||

                    tecla === "s"

                ) {


                    event.preventDefault();


                    mover(
                        1,
                        0
                    );

                }


                /*
                    ESQUERDA
                */

                if (

                    tecla === "arrowleft" ||

                    tecla === "a"

                ) {


                    event.preventDefault();


                    mover(
                        0,
                        -1
                    );

                }


                /*
                    DIREITA
                */

                if (

                    tecla === "arrowright" ||

                    tecla === "d"

                ) {


                    event.preventDefault();


                    mover(
                        0,
                        1
                    );

                }

            }
        );


        /* =====================================================
           BOTÕES MOBILE
        ===================================================== */

        function configurarBotao(
            id,
            dLinha,
            dColuna
        ) {


            const botao =
                document.getElementById(
                    id
                );


            /*
                TOUCH
            */

            botao.addEventListener(
                "touchstart",
                function(event) {


                    event.preventDefault();


                    mover(
                        dLinha,
                        dColuna
                    );


                },
                {
                    passive: false
                }
            );


            /*
                CLICK
            */

            botao.addEventListener(
                "click",
                function(event) {


                    event.preventDefault();


                    mover(
                        dLinha,
                        dColuna
                    );


                }
            );

        }


        configurarBotao(
            "cima",
            -1,
            0
        );


        configurarBotao(
            "baixo",
            1,
            0
        );


        configurarBotao(
            "esquerda",
            0,
            -1
        );


        configurarBotao(
            "direita",
            0,
            1
        );


        /* =====================================================
           BOTÃO COMEÇAR
        ===================================================== */

        document
            .getElementById(
                "comecar"
            )
            .addEventListener(
                "click",
                comecarJogo
            );


        /* =====================================================
           BOTÃO RESETAR
        ===================================================== */

        document
            .getElementById(
                "resetar"
            )
            .addEventListener(
                "click",
                resetarJogo
            );


        /* =====================================================
           REDIMENSIONAR
        ===================================================== */

        window.addEventListener(
            "resize",
            function() {

                desenharLabirinto();

            }
        );


        /* =====================================================
           INICIAR
        ===================================================== */

        gerarLabirinto();

    </script>

</body>

</html>
